<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指尖躲避</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            background: #000;
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .btn {
            position: absolute;
            padding: 12px 20px;
            font-size: 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 10;
        }
        /* 免死按钮（上面，不遮挡） */
        #getImmortalBtn {
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: #FF9800;
        }
        #immortalShopBtn {
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: #9C27B0;
        }
        /* 银行按钮（最下面） */
        #bankBtn {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #4CAF50;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div class="ui">分数: <span id="score">0</span></div>
        <button class="btn" id="getImmortalBtn">获取免死</button>
        <button class="btn" id="immortalShopBtn">免死商店</button>
        <button class="btn" id="bankBtn">银行</button>
    </div>

    <script>
        // 游戏数据
        let score = 0;
        let immortalTime = 0;
        let immortalShopPrice = 50;

        // 按钮功能
        document.getElementById('getImmortalBtn').addEventListener('click', () => {
            immortalTime += 3;
            alert('获得免死金牌！无敌3秒！');
        });

        document.getElementById('immortalShopBtn').addEventListener('click', () => {
            if (score >= immortalShopPrice) {
                score -= immortalShopPrice;
                immortalTime += 5;
                immortalShopPrice += 20;
                alert('免死时间延长5秒！');
                document.getElementById('score').textContent = score;
            } else {
                alert('分数不够！');
            }
        });

        document.getElementById('bankBtn').addEventListener('click', () => {
            alert('银行功能即将上线！');
        });
    </script>
</body>
</html>
