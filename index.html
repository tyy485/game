<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>指尖躲避</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        /* 版本选择界面 */
        #versionScreen {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }
        .versionTitle {
            font-size: 40px;
            margin-bottom: 50px;
            color: #ffd700;
        }
        .versionBtn {
            padding: 15px 40px;
            font-size: 24px;
            border: none;
            border-radius: 15px;
            color: #fff;
            margin: 20px 0;
            width: 80%;
            max-width: 350px;
            cursor: pointer;
        }
        .phoneVersion {
            background: #3182ce;
        }
        .phoneVersion:hover {
            background: #2563eb;
        }
        .pcVersion {
            background: #f59e0b;
        }
        .pcVersion:hover {
            background: #d97706;
        }
        /* 页面容器 */
        #startScreen, #gameScreen {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 5;
        }
        #gameScreen {
            justify-content: flex-start;
            padding-top: 20px;
        }
        /* 返回上一级按钮 */
        .backPreBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            padding: 8px 15px;
            background: #64748b;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            z-index: 6;
        }
        /* 主界面样式 - 标题仅遮盖指尖二字 */
        .titleBox {
            position: relative;
            margin-bottom: 20px;
            font-size: 36px;
            color: #ffd700;
        }
        .pcTitle .tipian {
            position: relative;
            display: inline-block;
        }
        .pcTitle .tipian::after {
            content: "键盘";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ef4444;
            color: #ffd700;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scoreBoard {
            font-size: 20px;
            margin: 10px 0;
            text-align: center;
        }
        .btn {
            padding: 12px 30px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: #3182ce;
            color: #fff;
            margin: 10px 0;
            width: 80%;
            max-width: 300px;
            cursor: pointer;
        }
        .btn:hover {
            background: #2563eb;
        }
        .storeBtn {
            background: #f59e0b;
        }
        .storeBtn:hover {
            background: #d97706;
        }
        .settingsBtn {
            background: #64748b;
        }
        .settingsBtn:hover {
            background: #475569;
        }
        .customBtn {
            background: #8b5cf6;
        }
        .customBtn:hover {
            background: #7c3aed;
        }
        .resetBtn {
            background: #ef4444;
            margin-top: 20px;
        }
        .resetBtn:hover {
            background: #dc2626;
        }
        /* 游戏区域 */
        #game {
            width: 100%;
            height: 70vh;
            background: #2d3748;
            position: relative;
            overflow: hidden;
            border: 2px solid #fff;
            margin-top: 10px;
        }
        #player {
            width: 40px;
            height: 40px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .obstacle {
            width: 60px;
            height: 20px;
            position: absolute;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        /* 金色砖块 - 触碰仅存分不死 核心样式 */
        .goldBrick {
            width: 50px;
            height: 50px;
            position: absolute;
            border-radius: 6px;
            background: #ffd700;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 8;
        }
        /* 游戏UI - 移除存分按钮，新增广告领免死按钮 */
        .gameUI {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            padding: 0 5px;
        }
        .gameUIMid {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #pauseBtn, #backBtn, #adImmortalBtn {
            font-size: 16px;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
        }
        #pauseBtn {
            background: #f6ad55;
        }
        #backBtn {
            background: #64748b;
        }
        /* 免死广告按钮 - 金色高亮 */
        #adImmortalBtn {
            background: #ffd700;
            color: #1e1e1e;
            font-weight: bold;
        }
        #adImmortalBtn:hover {
            background: #fcd34d;
        }
        /* 免死计时器 */
        #timer {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #ffd700;
            font-size: 18px;
            padding: 5px 15px;
            border-radius: 20px;
            z-index: 10;
            display: none;
        }
        /* 暂停面板 - 替换为广告领免死按钮 */
        #pauseMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        #pauseMenu .adBtn {
            background: #ffd700;
            color: #1e1e1e;
            font-weight: bold;
            margin: 10px 0;
        }
        #pauseMenu .adBtn:hover {
            background: #fcd34d;
        }
        /* 商店/设置/自定义面板通用 */
        #storePanel, #settingsPanel, #customPanel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        #storePanel h2, #settingsPanel h2, #customPanel h2 {
            margin-bottom: 20px;
            color: #ffd700;
        }
        #storeInfo {
            font-size: 18px;
            margin: 10px 0;
            text-align: center;
        }
        .settingItem {
            width: 100%;
            max-width: 300px;
            margin: 15px 0;
            text-align: left;
        }
        .settingItem label {
            display: block;
            margin-bottom: 5px;
            font-size: 18px;
        }
        .settingItem select, .settingItem input {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        /* 隐藏文件选择框 */
        .fileInput {
            display: none;
        }
        /* 遮罩层 */
        #mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 199;
            display: none;
        }
        /* 自定义弹窗核心样式 */
        #customModal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2d3748;
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 30px 25px;
            width: 90%;
            max-width: 350px;
            z-index: 200;
            display: none;
            text-align: center;
        }
        .modal-title {
            font-size: 22px;
            color: #ffd700;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .modal-content {
            font-size: 18px;
            color: #f1f1f1;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .modal-input {
            width: 180px;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            border-radius: 8px;
            border: none;
            margin-bottom: 25px;
            background: #4a5568;
            color: #fff;
        }
        .modal-input::placeholder {
            color: #9ca3af;
        }
        .modal-btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 10px 0;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .modal-cancel {
            background: #ef4444;
            color: #fff;
        }
        .modal-confirm {
            background: #3182ce;
            color: #fff;
        }
        .modal-btn:hover {
            opacity: 0.9;
        }
        /* 10秒广告弹窗 核心样式（新增广告内容显示区） */
        #adModal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e1e1e;
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            z-index: 200;
            display: none;
            text-align: center;
        }
        .ad-title {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 20px;
        }
        /* 广告内容显示核心区 */
        .ad-content {
            font-size: 20px;
            color: #fff;
            margin: 20px 0;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ad-progress {
            width: 100%;
            height: 10px;
            background: #475569;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }
        .ad-progress-bar {
            height: 100%;
            background: #ffd700;
            width: 0%;
            transition: width 1s linear;
        }
        .ad-time {
            font-size: 18px;
            color: #fff;
            margin-bottom: 20px;
        }
        .ad-close-btn {
            padding: 10px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #ef4444;
            color: #fff;
            cursor: pointer;
            display: none;
        }
        .ad-close-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <!-- 版本选择界面（双版本数据互通） -->
    <div id="versionScreen">
        <div class="versionTitle">选择游玩版本</div>
        <button class="versionBtn phoneVersion" onclick="selectVersion('phone')">手机版</button>
        <button class="versionBtn pcVersion" onclick="selectVersion('pc')">电脑版</button>
    </div>
    <!-- 主界面（免死商店改为升级时长） -->
    <div id="startScreen">
        <button class="backPreBtn" onclick="backToVersion()">回到上一级</button>
        <div class="titleBox" id="titleBox">
            <span class="tipian">指尖</span>躲避
        </div>
        <div class="scoreBoard">总得分: <span id="totalScore">0</span></div>
        <div class="scoreBoard">免死时长: <span id="immortalTimeLevel">10</span> 秒/次</div>
        <button class="btn" onclick="startGame()">开始游戏</button>
        <button class="btn storeBtn" onclick="openStore()">升级免死时长</button>
        <button class="btn settingsBtn" onclick="openSettings()">基础设置</button>
        <button class="btn customBtn" onclick="openCustomPanel()">自定义造型</button>
    </div>
    <!-- 游戏界面（移除存分按钮，新增广告领免死） -->
    <div id="gameScreen">
        <div class="gameUI">
            <button id="pauseBtn" onclick="togglePause()">暂停</button>
            <div class="gameUIMid">
                <div>当前得分: <span id="currentScore">0</span></div>
                <button id="adImmortalBtn" onclick="openAdModal()">看广告得免死</button>
            </div>
            <button id="backBtn" onclick="backToStart()">返回主页</button>
        </div>
        <div id="game">
            <div id="player"></div>
            <div id="timer">10</div>
            <div id="pauseMenu">
                <h2>游戏暂停</h2>
                <button class="btn" onclick="togglePause()">继续游戏</button>
                <button class="btn adBtn" onclick="openAdModal()">看10秒广告得免死金牌</button>
                <button class="btn" onclick="backToStart()">返回主页</button>
            </div>
        </div>
    </div>
    <!-- 免死商店（升级时长，显示当前/升级后时长） -->
    <div id="storePanel">
        <h2>升级免死时长</h2>
        <div id="storeInfo">当前总得分: <span id="storeTotalScore">0</span></div>
        <div id="storeInfo">升级价格: <span id="buyPrice">10</span> 分</div>
        <div id="storeInfo">当前时长: <span id="addTime">10</span> 秒/次</div>
        <div id="storeInfo">升级后: <span id="nextTime">15</span> 秒/次</div>
        <button class="btn storeBtn" onclick="upgradeImmortalTime()">升级时长</button>
        <button class="btn" onclick="closeStore()">关闭</button>
    </div>
    <!-- 基础设置面板 -->
    <div id="settingsPanel">
        <h2>基础设置</h2>
        <div class="settingItem">
            <label>障碍物频率</label>
            <select id="freqSelect">
                <option value="2000">很低</option>
                <option value="1500">低</option>
                <option value="1000" selected>中</option>
                <option value="700">高</option>
                <option value="500">很高</option>
                <option value="300">特别高</option>
                <option value="150">最高</option>
            </select>
        </div>
        <div class="settingItem">
            <label>玩家方块颜色</label>
            <input type="color" id="playerColor" value="#3182ce">
        </div>
        <div class="settingItem">
            <label>障碍物颜色</label>
            <input type="color" id="obsColor" value="#e53e3e">
        </div>
        <button class="btn" onclick="saveSettings()">保存设置</button>
        <button class="btn resetBtn" onclick="startResetVerify()">重置所有游戏数据</button>
        <button class="btn" onclick="closeSettings()">关闭</button>
    </div>
    <!-- 自定义造型面板（金色砖块图片自定义） -->
    <div id="customPanel">
        <h2>自定义造型设置</h2>
        <div class="settingItem">
            <label>选择玩家方块图片</label>
            <input type="file" id="playerImgSelector" class="fileInput" accept="image/*">
            <button class="btn customBtn" onclick="document.getElementById('playerImgSelector').click()">从相册选择图片</button>
            <p style="font-size:14px; margin-top:5px; color:#ccc;">支持PNG/JPG格式，自动适配尺寸</p>
        </div>
        <div class="settingItem">
            <label>选择障碍物图片</label>
            <input type="file" id="obsImgSelector" class="fileInput" accept="image/*">
            <button class="btn customBtn" onclick="document.getElementById('obsImgSelector').click()">从相册选择图片</button>
            <p style="font-size:14px; margin-top:5px; color:#ccc;">支持PNG/JPG格式，自动适配尺寸</p>
        </div>
        <div class="settingItem">
            <label>选择金色砖块图片</label>
            <input type="file" id="goldBrickImgSelector" class="fileInput" accept="image/*">
            <button class="btn customBtn" onclick="document.getElementById('goldBrickImgSelector').click()">从相册选择图片</button>
            <p style="font-size:14px; margin-top:5px; color:#ccc;">支持PNG/JPG格式，自动适配尺寸</p>
        </div>
        <div class="settingItem">
            <label>恢复默认造型</label>
            <button class="btn" onclick="restoreDefaultStyles()">恢复默认</button>
        </div>
        <button class="btn" onclick="closeCustomPanel()">完成设置</button>
    </div>
    <!-- 自定义弹窗相关 -->
    <div id="mask"></div>
    <div id="customModal">
        <div class="modal-title" id="modalTitle">温馨提示</div>
        <div class="modal-content" id="modalContent">确认执行此操作吗？</div>
        <input type="number" class="modal-input" id="modalInput" placeholder="输入验证信息" style="display:none;">
        <div class="modal-btn-group">
            <button class="modal-btn modal-cancel" onclick="closeModalAndResetCount()">取消</button>
            <button class="modal-btn modal-confirm" id="modalConfirm" onclick="modalConfirmClick()">确认</button>
        </div>
    </div>
    <!-- 10秒广告弹窗 核心DOM（新增广告内容区） -->
    <div id="adModal">
        <div class="ad-title">观看广告领取免死金牌</div>
        <!-- 广告随机内容显示区 -->
        <div class="ad-content" id="adContent"></div>
        <div class="ad-progress">
            <div class="ad-progress-bar" id="adProgressBar"></div>
        </div>
        <div class="ad-time" id="adTime">剩余：10 秒</div>
        <button class="ad-close-btn" id="adCloseBtn" onclick="closeAdModal()">关闭</button>
    </div>

    <script>
        // === 全局核心配置（双版本数据互通，共用localStorage） ===
        const currentYear = new Date().getFullYear();
        let resetRemindCount = 0;
        let modalType = '';
        let gameVersion = ''; // phone/pc 控制操作+广告版本名
        const keyStep = 15; // 电脑版键盘步长
        const goldBrickInterval = 15000; // 金色砖块独立生成间隔(ms)，与障碍物分离
        let lastGoldBrickTime = 0; // 最后生成金色砖块时间
        // === 存档数据结构（含金色砖块图片、免死时长等级） ===
        let gameData = {
            totalScore: 0,          // 唯一总得分，金色砖块触碰自动存入
            immortalTime: 10,       // 免死基础时长（商店升级）
            buyPrice: 10,           // 免死升级价格
            obstacleFreq: 1000,     // 障碍物频率，双版本互通
            playerColor: '#3182ce', // 玩家颜色
            obsColor: '#e53e3e',    // 障碍物颜色
            playerImg: '',          // 玩家图片
            obsImg: '',             // 障碍物图片
            goldBrickImg: ''        // 金色砖块图片
        };
        // === DOM元素获取（新增金色砖块、广告相关元素） ===
        const versionScreen = document.getElementById('versionScreen');
        const titleBox = document.getElementById('titleBox');
        // 核心分数UI
        const totalScoreEl = document.getElementById('totalScore');
        const immortalTimeLevelEl = document.getElementById('immortalTimeLevel');
        const currentScoreEl = document.getElementById('currentScore');
        const storeTotalScoreEl = document.getElementById('storeTotalScore');
        const buyPriceEl = document.getElementById('buyPrice');
        const addTimeEl = document.getElementById('addTime');
        const nextTimeEl = document.getElementById('nextTime');
        // 面板元素
        const startScreen = document.getElementById('startScreen');
        const gameScreen = document.getElementById('gameScreen');
        const game = document.getElementById('game');
        const player = document.getElementById('player');
        const pauseMenu = document.getElementById('pauseMenu');
        const storePanel = document.getElementById('storePanel');
        const settingsPanel = document.getElementById('settingsPanel');
        const customPanel = document.getElementById('customPanel');
        // 免死与游戏状态
        const timerEl = document.getElementById('timer');
        let currentScore = 0;
        let gameRunning = false;
        let isPaused = false;
        let gameOver = false;
        let isImmortal = false;
        let immortalLeftTime = 0;
        let immortalTimer = null;
        let obstacles = [];
        let goldBricks = []; // 金色砖块数组
        let lastObstacleTime = 0;
        let obstacleSpeed = 3;
        // 弹窗元素
        const mask = document.getElementById('mask');
        const customModal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalContent = document.getElementById('modalContent');
        const modalInput = document.getElementById('modalInput');
        const modalConfirm = document.getElementById('modalConfirm');
        // 广告弹窗元素（新增广告内容区）
        const adModal = document.getElementById('adModal');
        const adContent = document.getElementById('adContent');
        const adProgressBar = document.getElementById('adProgressBar');
        const adTimeEl = document.getElementById('adTime');
        const adCloseBtn = document.getElementById('adCloseBtn');
        let adTimer = null;
        let adLeftTime = 10;

        // === 广告内容池（含25%概率特殊广告+版本自适应） ===
        function getRandomAdContent() {
            // 基础广告池（9条，75%概率）
            const baseAds = [
                '京东0.01元大甩购',
                '拼多多6202恋爱补贴',
                '访问tyy485.github.io/games/，得到超好的游戏体验',
                'turbowarp.org，可视化编程制作游戏',
                '想学会游戏怎么做吗？先学学HTML吧！',
                '这只是个广告',
                '访问mcjs.cc，免费游玩MC！',
                '额…为什么要看我？',
                '游戏由陶阳样制作！'
            ];
            // 高概率广告（25%）
            const highProbAd = '看到我的发大财';
            // 版本自适应广告
            const versionAd = `你知道吗？其实你正在玩的游戏是${gameVersion === 'phone' ? '指尖躲避' : '键盘躲避'}哦！`;
            // 合并所有广告（baseAds+versionAd 共10条，+highProbAd 总计11条，实现25%概率）
            const allAds = [...baseAds, versionAd, highProbAd, highProbAd, highProbAd];
            // 随机选一条
            return allAds[Math.floor(Math.random() * allAds.length)];
        }

        // === 自定义弹窗核心方法 ===
        function openModal(type, title, content, needInput = false) {
            mask.style.display = 'block';
            customModal.style.display = 'block';
            modalType = type;
            modalTitle.innerText = title;
            modalContent.innerText = content;
            if (needInput) {
                modalInput.style.display = 'block';
                modalInput.value = '';
                modalInput.focus();
            } else {
                modalInput.style.display = 'none';
            }
        }
        function closeModalAndResetCount() {
            mask.style.display = 'none';
            customModal.style.display = 'none';
            resetRemindCount = 0;
            modalType = '';
        }
        function modalConfirmClick() {
            switch (modalType) {
                case 'remind1': handleRemind1Confirm(); break;
                case 'remind2': handleRemind2Confirm(); break;
                case 'remind3': handleRemind3Confirm(); break;
                case 'verify': handleVerifyConfirm(); break;
                case 'success': closeModalAndResetCount(); break;
                case 'error': closeModalAndResetCount(); break;
                case 'gameOver': closeModalAndResetCount(); break;
            }
        }

        // === 重置验证逻辑 ===
        function startResetVerify() {
            resetRemindCount = 1;
            openModal('remind1','第一次确认','确定要重置游戏数据吗？数据清除后将不可恢复，还需确认2次');
        }
        function handleRemind1Confirm() {
            resetRemindCount = 2;
            openModal('remind2','第二次确认','最后警告！重置将清除所有得分、等级、自定义造型和设置，还需确认1次');
        }
        function handleRemind2Confirm() {
            resetRemindCount = 3;
            openModal('remind3','第三次确认','即将进入验证环节！请确认是否继续，下一步需输入当前年份完成最终验证');
        }
        function handleVerifyConfirm() {
            const inputYear = parseInt(modalInput.value);
            if (isNaN(inputYear) || inputYear !== currentYear) {
                modalContent.innerText = `年份输入错误！请输入正确年份：${currentYear}`;
                modalInput.value = '';
                modalInput.focus();
                return;
            }
            resetAllGameData();
            mask.style.display = 'none';
            customModal.style.display = 'none';
            resetRemindCount = 0;
            modalType = '';
        }
        function resetAllGameData() {
            gameData = { 
                totalScore:0, immortalTime:10, buyPrice:10, obstacleFreq:1000,
                playerColor:'#3182ce', obsColor:'#e53e3e', 
                playerImg:'', obsImg:'', goldBrickImg:'' 
            };
            saveGameData();
            applyCustomStyles();
            document.getElementById('freqSelect').value = gameData.obstacleFreq;
            document.getElementById('playerColor').value = gameData.playerColor;
            document.getElementById('obsColor').value = gameData.obsColor;
            openModal('success','重置成功','所有游戏数据已恢复为初始状态！');
            setTimeout(closeModalAndResetCount, 3000);
        }

        // === 存档核心方法 ===
        function loadGameData() {
            const saved = localStorage.getItem('fingerDodgeData');
            if (saved) {
                gameData = JSON.parse(saved);
                totalScoreEl.innerText = gameData.totalScore;
                immortalTimeLevelEl.innerText = gameData.immortalTime;
                buyPriceEl.innerText = gameData.buyPrice;
                addTimeEl.innerText = gameData.immortalTime;
                nextTimeEl.innerText = gameData.immortalTime + 5;
                document.getElementById('freqSelect').value = gameData.obstacleFreq;
                document.getElementById('playerColor').value = gameData.playerColor;
                document.getElementById('obsColor').value = gameData.obsColor;
                applyCustomStyles();
            }
        }
        function saveGameData() {
            localStorage.setItem('fingerDodgeData', JSON.stringify(gameData));
            totalScoreEl.innerText = gameData.totalScore;
            immortalTimeLevelEl.innerText = gameData.immortalTime;
        }

        // === 自定义造型方法（金色砖块图片适配） ===
        function applyCustomStyles() {
            // 玩家造型
            if (gameData.playerImg) {
                player.style.backgroundImage = `url(${gameData.playerImg})`;
                player.style.backgroundColor = 'transparent';
            } else {
                player.style.backgroundImage = 'none';
                player.style.backgroundColor = gameData.playerColor;
            }
            // 障碍物造型
            obstacles.forEach(obs => {
                if (gameData.obsImg) {
                    obs.el.style.backgroundImage = `url(${gameData.obsImg})`;
                    obs.el.style.backgroundColor = 'transparent';
                } else {
                    obs.el.style.backgroundImage = 'none';
                    obs.el.style.backgroundColor = gameData.obsColor;
                }
            });
            // 金色砖块造型
            goldBricks.forEach(brick => {
                if (gameData.goldBrickImg) {
                    brick.el.style.backgroundImage = `url(${gameData.goldBrickImg})`;
                    brick.el.style.backgroundColor = 'transparent';
                } else {
                    brick.el.style.backgroundImage = 'none';
                    brick.el.style.backgroundColor = '#ffd700';
                }
            });
        }
        function initImageSelectors() {
            // 玩家图片
            document.getElementById('playerImgSelector').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                readImageFile(file, 40, 40, (base64) => {
                    gameData.playerImg = base64;
                    saveGameData();
                    applyCustomStyles();
                    openModal('success', '设置成功', '玩家造型已更新！');
                    setTimeout(closeModalAndResetCount, 2000);
                });
            });
            // 障碍物图片
            document.getElementById('obsImgSelector').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                readImageFile(file, 60, 20, (base64) => {
                    gameData.obsImg = base64;
                    saveGameData();
                    applyCustomStyles();
                    openModal('success', '设置成功', '障碍物造型已更新！');
                    setTimeout(closeModalAndResetCount, 2000);
                });
            });
            // 金色砖块图片
            document.getElementById('goldBrickImgSelector').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                readImageFile(file, 50, 50, (base64) => {
                    gameData.goldBrickImg = base64;
                    saveGameData();
                    applyCustomStyles();
                    openModal('success', '设置成功', '金色砖块造型已更新！');
                    setTimeout(closeModalAndResetCount, 2000);
                });
            });
        }
        // 图片读取适配（尺寸参数）
        function readImageFile(file, w, h, callback) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = w;
                    canvas.height = h;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/png'));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
        function restoreDefaultStyles() {
            gameData.playerImg = ''; gameData.obsImg = ''; gameData.goldBrickImg = '';
            gameData.playerColor = '#3182ce'; gameData.obsColor = '#e53e3e';
            document.getElementById('playerColor').value = '#3182ce';
            document.getElementById('obsColor').value = '#e53e3e';
            saveGameData();
            applyCustomStyles();
            openModal('success', '恢复成功', '已恢复默认造型！');
            setTimeout(closeModalAndResetCount, 2000);
        }

        // === 金色砖块核心逻辑（独立生成+触碰仅存分不死 核心优化） ===
        function createGoldBrick() {
            const brick = document.createElement('div');
            brick.classList.add('goldBrick');
            // 应用自定义造型
            if (gameData.goldBrickImg) {
                brick.style.backgroundImage = `url(${gameData.goldBrickImg})`;
                brick.style.backgroundColor = 'transparent';
            } else {
                brick.style.backgroundImage = 'none';
                brick.style.backgroundColor = '#ffd700';
            }
            // 随机生成位置（避开边缘，与障碍物无关联）
            const x = Math.random() * (game.clientWidth - 50);
            brick.style.left = x + 'px';
            brick.style.top = '0px';
            game.appendChild(brick);
            goldBricks.push({ el: brick, x: x, y: 0 });
        }
        // 金色砖块触碰检测（仅存分，不死，不终止游戏）
        function checkGoldBrickCollision() {
            for (let i = goldBricks.length - 1; i >= 0; i--) {
                const brick = goldBricks[i];
                if (checkCollision(player, brick.el)) {
                    // 触碰后仅存分，无死亡判定
                    if (currentScore > 0) {
                        gameData.totalScore += currentScore;
                        const saveNum = currentScore;
                        currentScore = 0;
                        currentScoreEl.innerText = currentScore;
                        saveGameData();
                        openModal('success', '存分成功', `触碰金色砖块！已将${saveNum}分存入总得分，当前总得分：${gameData.totalScore}`);
                        setTimeout(closeModalAndResetCount, 1500);
                    } else {
                        openModal('success', '提示', '金色砖块触碰成功！当前无得分可存入～');
                        setTimeout(closeModalAndResetCount, 1000);
                    }
                    // 移除金色砖块，游戏继续
                    brick.el.remove();
                    goldBricks.splice(i, 1);
                    return;
                }
                // 超出屏幕移除
                if (brick.y > game.clientHeight) {
                    brick.el.remove();
                    goldBricks.splice(i, 1);
                }
            }
        }

        // === 10秒广告领免死 核心逻辑（新增随机广告内容） ===
        function openAdModal() {
            if (isImmortal) {
                openModal('error', '操作失败', '当前已拥有免死金牌，无需重复领取！');
                return;
            }
            // 初始化广告弹窗：加载随机广告内容
            adContent.innerText = getRandomAdContent();
            adModal.style.display = 'block';
            adLeftTime = 10;
            adProgressBar.style.width = '0%';
            adTimeEl.innerText = `剩余：${adLeftTime} 秒`;
            adCloseBtn.style.display = 'none';
            // 启动广告倒计时
            adTimer = setInterval(() => {
                adLeftTime--;
                const progress = (10 - adLeftTime) / 10 * 100;
                adProgressBar.style.width = `${progress}%`;
                adTimeEl.innerText = `剩余：${adLeftTime} 秒`;
                // 广告结束
                if (adLeftTime <= 0) {
                    clearInterval(adTimer);
                    adProgressBar.style.width = '100%';
                    adTimeEl.innerText = '广告结束！已领取免死金牌';
                    adCloseBtn.style.display = 'block';
                    // 激活免死金牌（时长为商店升级后的值）
                    activateImmortal(gameData.immortalTime);
                }
            }, 1000);
        }
        function closeAdModal() {
            clearInterval(adTimer);
            adModal.style.display = 'none';
        }
        // 免死金牌激活（适配商店升级时长）
        function activateImmortal(time) {
            isImmortal = true;
            immortalLeftTime = time;
            timerEl.style.display = 'block';
            timerEl.innerText = immortalLeftTime;
            if (immortalTimer) clearInterval(immortalTimer);
            immortalTimer = setInterval(() => {
                immortalLeftTime--;
                timerEl.innerText = immortalLeftTime;
                if (immortalLeftTime <= 0) {
                    clearInterval(immortalTimer);
                    immortalTimer = null;
                    isImmortal = false;
                    timerEl.style.display = 'none';
                }
            }, 1000);
        }

        // === 免死商店升级逻辑 ===
        function upgradeImmortalTime() {
            if (gameData.totalScore < gameData.buyPrice) {
                openModal('error', '操作失败', '总得分不足，无法升级免死时长！');
                return;
            }
            // 扣除分数，升级时长
            gameData.totalScore -= gameData.buyPrice;
            gameData.immortalTime += 5;
            gameData.buyPrice += 10;
            // 更新数据与UI
            saveGameData();
            storeTotalScoreEl.innerText = gameData.totalScore;
            buyPriceEl.innerText = gameData.buyPrice;
            addTimeEl.innerText = gameData.immortalTime;
            nextTimeEl.innerText = gameData.immortalTime + 5;
            immortalTimeLevelEl.innerText = gameData.immortalTime;
            openModal('success', '升级成功', `免死时长已升级为${gameData.immortalTime}秒/次！`);
            setTimeout(closeModalAndResetCount, 2000);
        }

        // === 面板控制方法 ===
        function selectVersion(version) {
            gameVersion = version;
            versionScreen.style.display = 'none';
            startScreen.style.display = 'flex';
            titleBox.classList.toggle('pcTitle', version === 'pc');
        }
        function backToVersion() {
            startScreen.style.display = 'none';
            versionScreen.style.display = 'flex';
            titleBox.classList.remove('pcTitle');
            gameVersion = '';
            storePanel.style.display = 'none';
            settingsPanel.style.display = 'none';
            customPanel.style.display = 'none';
            closeModalAndResetCount();
        }
        function openStore() {
            if (gameOver) return;
            storeTotalScoreEl.innerText = gameData.totalScore;
            storePanel.style.display = 'flex';
        }
        function closeStore() { storePanel.style.display = 'none'; }
        function openSettings() {
            settingsPanel.style.display = 'flex';
            resetRemindCount = 0;
        }
        function closeSettings() {
            settingsPanel.style.display = 'none';
            resetRemindCount = 0;
        }
        function openCustomPanel() { customPanel.style.display = 'flex'; }
        function closeCustomPanel() { customPanel.style.display = 'none'; }

        // === 游戏核心逻辑（金色砖块独立生成+碰撞优化） ===
        function startGame() {
            currentScore = 0;
            currentScoreEl.innerText = currentScore;
            gameOver = false;
            isPaused = false;
            isImmortal = false;
            immortalLeftTime = 0;
            timerEl.style.display = 'none';
            // 重置生成时间，避免开局立即生成
            lastObstacleTime = 0;
            lastGoldBrickTime = 0;
            // 清除所有元素
            obstacles.forEach(obs => obs.el.remove());
            goldBricks.forEach(brick => brick.el.remove());
            obstacles = [];
            goldBricks = [];
            obstacleSpeed = 3;
            applyCustomStyles();
            startScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            if (!gameRunning) {
                gameRunning = true;
                requestAnimationFrame(gameLoop);
            }
        }
        function backToStart() {
            // 未存的当前得分自动合并
            if (currentScore > 0) {
                gameData.totalScore += currentScore;
                currentScore = 0;
                saveGameData();
            }
            // 清理计时器
            if (immortalTimer) {
                clearInterval(immortalTimer);
                immortalTimer = null;
            }
            if (adTimer) {
                clearInterval(adTimer);
                adTimer = null;
            }
            isImmortal = false;
            immortalLeftTime = 0;
            timerEl.style.display = 'none';
            adModal.style.display = 'none';
            // 清理元素
            obstacles.forEach(obs => obs.el.remove());
            goldBricks.forEach(brick => brick.el.remove());
            obstacles = [];
            goldBricks = [];
            gameRunning = false;
            isPaused = false;
            gameOver = false;
            resetRemindCount = 0;
            gameScreen.style.display = 'none';
            startScreen.style.display = 'flex';
            pauseMenu.style.display = 'none';
            closeModalAndResetCount();
        }
        function togglePause() {
            isPaused = !isPaused;
            pauseMenu.style.display = isPaused ? 'flex' : 'none';
        }
        function saveSettings() {
            gameData.obstacleFreq = parseInt(document.getElementById('freqSelect').value);
            gameData.playerColor = document.getElementById('playerColor').value;
            gameData.obsColor = document.getElementById('obsColor').value;
            if (!gameData.playerImg) player.style.backgroundColor = gameData.playerColor;
            if (!gameData.obsImg) obstacles.forEach(obs => obs.el.style.backgroundColor = gameData.obsColor);
            saveGameData();
            openModal('success', '保存成功', '设置已永久生效，双版本共用！');
            setTimeout(() => { closeModalAndResetCount(); closeSettings(); }, 2000);
        }
        // 精准碰撞检测
        function checkCollision(el1, el2) {
            const r1 = el1.getBoundingClientRect();
            const r2 = el2.getBoundingClientRect();
            return !(
                r1.right < r2.left + 2 || 
                r1.left > r2.right - 2 || 
                r1.bottom < r2.top + 2 || 
                r1.top > r2.bottom - 2
            );
        }
        function createObstacle() {
            const obs = document.createElement('div');
            obs.classList.add('obstacle');
            if (gameData.obsImg) {
                obs.style.backgroundImage = `url(${gameData.obsImg})`;
                obs.el.style.backgroundColor = 'transparent';
            } else {
                obs.style.backgroundImage = 'none';
                obs.style.backgroundColor = gameData.obsColor;
            }
            const x = Math.random() * (game.clientWidth - 60);
            obs.style.left = x + 'px';
            obs.style.top = '0px';
            game.appendChild(obs);
            obstacles.push({ el: obs, x: x, y: 0 });
        }
        // 游戏主循环（金色砖块独立生成+碰撞分离 核心优化）
        function gameLoop(timestamp) {
            if (!gameRunning) return;
            if (gameOver || isPaused) {
                requestAnimationFrame(gameLoop);
                return;
            }
            // 1. 独立生成红色障碍物（原有逻辑）
            if (timestamp - lastObstacleTime > gameData.obstacleFreq) {
                createObstacle();
                lastObstacleTime = timestamp;
                obstacleSpeed = 3 + gameData.totalScore / 200;
            }
            // 2. 独立生成金色砖块（与障碍物无关联，固定间隔）
            if (timestamp - lastGoldBrickTime > goldBrickInterval) {
                createGoldBrick();
                lastGoldBrickTime = timestamp;
            }
            // 3. 更新红色障碍物位置+碰撞检测（仅障碍物致死）
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += obstacleSpeed;
                obs.el.style.top = obs.y + 'px';
                // 仅红色障碍物有死亡碰撞，金色砖块无
                if (!isImmortal && checkCollision(player, obs.el)) {
                    gameOver = true;
                    gameData.totalScore += currentScore;
                    currentScore = 0;
                    saveGameData();
                    openModal('gameOver', '游戏结束', `本局得分：${gameData.totalScore}\n当前总得分：${gameData.totalScore}`);
                    setTimeout(backToStart, 3000);
                    break;
                }
                // 超出屏幕移除
                if (obs.y > game.clientHeight) {
                    obs.el.remove();
                    obstacles.splice(i, 1);
                    currentScore++;
                    currentScoreEl.innerText = currentScore;
                }
            }
            // 4. 更新金色砖块位置+单独碰撞检测（仅存分，不死）
            for (let i = goldBricks.length - 1; i >= 0; i--) {
                const brick = goldBricks[i];
                brick.y += obstacleSpeed;
                brick.el.style.top = brick.y + 'px';
            }
            checkGoldBrickCollision();
            requestAnimationFrame(gameLoop);
        }

        // === 控制逻辑（双版本独立操作） ===
        // 手机版：触屏控制
        game.addEventListener('touchmove', (e) => {
            if (gameOver || isPaused || gameVersion !== 'phone') return;
            const touch = e.touches[0];
            const rect = game.getBoundingClientRect();
            let playerX = touch.clientX - rect.left - player.clientWidth / 2;
            playerX = Math.max(0, Math.min(playerX, rect.width - player.clientWidth));
            player.style.left = playerX + 'px';
        });
        // 电脑版：键盘←→/A/D控制
        document.addEventListener('keydown', (e) => {
            if (gameOver || isPaused || gameVersion !== 'pc') return;
            const rect = game.getBoundingClientRect();
            let currentX = parseFloat(player.style.left) || (rect.width / 2 - player.clientWidth / 2);
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') currentX -= keyStep;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') currentX += keyStep;
            currentX = Math.max(0, Math.min(currentX, rect.width - player.clientWidth));
            player.style.left = currentX + 'px';
        });

        // === 页面初始化 ===
        window.onload = function() {
            loadGameData();
            initImageSelectors();
        };
        mask.addEventListener('click', closeModalAndResetCount);
        customModal.addEventListener('click', (e) => { e.stopPropagation(); });
        adModal.addEventListener('click', (e) => { e.stopPropagation(); });
    </script>
</body>
