<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>指尖躲避</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        /* 页面容器 */
        #startScreen, #gameScreen {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 5;
        }
        #gameScreen {
            display: none;
            justify-content: flex-start;
            padding-top: 20px;
        }
        /* 主界面样式 */
        #startScreen h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #ffd700;
        }
        .scoreBoard {
            font-size: 20px;
            margin: 10px 0;
            text-align: center;
        }
        .btn {
            padding: 12px 30px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: #3182ce;
            color: #fff;
            margin: 10px 0;
            width: 80%;
            max-width: 300px;
            cursor: pointer;
        }
        .btn:hover {
            background: #2563eb;
        }
        .storeBtn {
            background: #f59e0b;
        }
        .storeBtn:hover {
            background: #d97706;
        }
        .settingsBtn {
            background: #64748b;
        }
        .settingsBtn:hover {
            background: #475569;
        }
        .customBtn {
            background: #8b5cf6;
        }
        .customBtn:hover {
            background: #7c3aed;
        }
        .resetBtn {
            background: #ef4444;
            margin-top: 20px;
        }
        .resetBtn:hover {
            background: #dc2626;
        }
        /* 游戏区域 */
        #game {
            width: 100%;
            height: 70vh;
            background: #2d3748;
            position: relative;
            overflow: hidden;
            border: 2px solid #fff;
            margin-top: 10px;
        }
        #player {
            width: 40px;
            height: 40px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .obstacle {
            width: 60px;
            height: 20px;
            position: absolute;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        /* 游戏UI - 新增获取免死按钮样式 */
        .gameUI {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .godBtn {
            font-size: 14px;
            padding: 6px 12px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #pauseBtn, #backBtn {
            font-size: 16px;
            padding: 5px 10px;
            background: #f6ad55;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
        }
        /* 免死计时器 */
        #timer {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #ffd700;
            font-size: 18px;
            padding: 5px 15px;
            border-radius: 20px;
            z-index: 10;
            display: none;
        }
        /* 暂停面板 */
        #pauseMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        /* 商店/设置/自定义面板通用 */
        #storePanel, #settingsPanel, #customPanel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        #storePanel h2, #settingsPanel h2, #customPanel h2 {
            margin-bottom: 20px;
            color: #ffd700;
        }
        #storeInfo {
            font-size: 18px;
            margin: 10px 0;
            text-align: center;
        }
        .settingItem {
            width: 100%;
            max-width: 300px;
            margin: 15px 0;
            text-align: left;
        }
        .settingItem label {
            display: block;
            margin-bottom: 5px;
            font-size: 18px;
        }
        .settingItem select, .settingItem input {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        /* 隐藏文件选择框 */
        .fileInput {
            display: none;
        }
        /* 遮罩层 */
        #mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 199;
            display: none;
        }
        /* 自定义弹窗核心样式 - CSS绘制 */
        #customModal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2d3748;
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 30px 25px;
            width: 90%;
            max-width: 350px;
            z-index: 200;
            display: none;
            text-align: center;
        }
        .modal-title {
            font-size: 22px;
            color: #ffd700;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .modal-content {
            font-size: 18px;
            color: #f1f1f1;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .modal-input {
            width: 180px;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            border-radius: 8px;
            border: none;
            margin-bottom: 25px;
            background: #4a5568;
            color: #fff;
        }
        .modal-input::placeholder {
            color: #9ca3af;
        }
        .modal-btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 10px 0;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .modal-cancel {
            background: #ef4444;
            color: #fff;
        }
        .modal-confirm {
            background: #3182ce;
            color: #fff;
        }
        .modal-btn:hover {
            opacity: 0.9;
        }
        /* 离线广告弹窗样式 - 核心（无网络图片） */
        #adModal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 2px solid #ffd700;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            z-index: 300;
            display: none;
            text-align: center;
            overflow: hidden;
        }
        #adDraw {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            line-height: 1.5;
        }
        #adCountdown {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,215,0,0.9);
            color: #000;
            font-size: 20px;
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 20px;
            z-index: 5;
        }
        #adTip {
            padding: 15px;
            font-size: 16px;
            color: #fff;
            background: #2d3748;
        }
    </style>
</head>
<body>
    <!-- 主界面 -->
    <div id="startScreen">
        <h1>指尖躲避</h1>
        <div class="scoreBoard">总得分: <span id="totalScore">0</span></div>
        <div class="scoreBoard">免死等级: <span id="immortalLevel">1</span></div>
        <button class="btn" onclick="startGame()">开始游戏</button>
        <button class="btn storeBtn" onclick="openStore()">免死商店</button>
        <button class="btn settingsBtn" onclick="openSettings()">基础设置</button>
        <button class="btn customBtn" onclick="openCustomPanel()">自定义造型</button>
    </div>
    <!-- 游戏界面 - 右上角获取免死金牌按钮 -->
    <div id="gameScreen">
        <div class="gameUI">
            <button id="pauseBtn" onclick="togglePause()">暂停</button>
            <div>当前得分: <span id="currentScore">0</span></div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button class="godBtn" onclick="showAdGetGod()">获取免死金牌</button>
                <button id="backBtn" onclick="backToStart()">返回</button>
            </div>
        </div>
        <div id="game">
            <div id="player"></div>
            <div id="timer">10</div>
            <!-- 暂停菜单 -->
            <div id="pauseMenu">
                <h2>游戏暂停</h2>
                <button class="btn" onclick="togglePause()">继续游戏</button>
                <button class="btn" onclick="backToStart()">返回主页</button>
            </div>
        </div>
    </div>
    <!-- 商店面板 -->
    <div id="storePanel">
        <h2>免死金牌商店</h2>
        <div id="storeInfo">当前得分: <span id="storeScore">0</span></div>
        <div id="storeInfo">购买价格: <span id="buyPrice">10</span> 分</div>
        <div id="storeInfo">获得时长: <span id="addTime">10</span> 秒</div>
        <button class="btn storeBtn" onclick="buyImmortal()">购买免死金牌</button>
        <button class="btn" onclick="closeStore()">关闭</button>
    </div>
    <!-- 基础设置面板 -->
    <div id="settingsPanel">
        <h2>基础设置</h2>
        <div class="settingItem">
            <label>障碍物频率</label>
            <select id="freqSelect">
                <option value="2000">很低</option>
                <option value="1500">低</option>
                <option value="1000" selected>中</option>
                <option value="700">高</option>
                <option value="500">很高</option>
                <option value="300">特别高</option>
                <option value="150">最高</option>
            </select>
        </div>
        <div class="settingItem">
            <label>玩家方块颜色</label>
            <input type="color" id="playerColor" value="#3182ce">
        </div>
        <div class="settingItem">
            <label>障碍物颜色</label>
            <input type="color" id="obsColor" value="#e53e3e">
        </div>
        <button class="btn" onclick="saveSettings()">保存设置</button>
        <button class="btn resetBtn" onclick="startResetVerify()">重置所有游戏数据</button>
        <button class="btn" onclick="closeSettings()">关闭</button>
    </div>
    <!-- 自定义造型面板 -->
    <div id="customPanel">
        <h2>自定义造型设置</h2>
        <div class="settingItem">
            <label>选择玩家方块图片</label>
            <input type="file" id="playerImgSelector" class="fileInput" accept="image/*">
            <button class="btn customBtn" onclick="document.getElementById('playerImgSelector').click()">从相册选择图片</button>
            <p style="font-size:14px; margin-top:5px; color:#ccc;">支持PNG/JPG格式，自动适配尺寸</p>
        </div>
        <div class="settingItem">
            <label>选择障碍物图片</label>
            <input type="file" id="obsImgSelector" class="fileInput" accept="image/*">
            <button class="btn customBtn" onclick="document.getElementById('obsImgSelector').click()">从相册选择图片</button>
            <p style="font-size:14px; margin-top:5px; color:#ccc;">支持PNG/JPG格式，自动适配尺寸</p>
        </div>
        <div class="settingItem">
            <label>恢复默认造型</label>
            <button class="btn" onclick="restoreDefaultStyles()">恢复默认</button>
        </div>
        <button class="btn" onclick="closeCustomPanel()">完成设置</button>
    </div>
    <!-- 自定义弹窗相关 -->
    <div id="mask"></div>
    <div id="customModal">
        <div class="modal-title" id="modalTitle">温馨提示</div>
        <div class="modal-content" id="modalContent">确认执行此操作吗？</div>
        <input type="number" class="modal-input" id="modalInput" placeholder="输入验证信息" style="display:none;">
        <div class="modal-btn-group">
            <button class="modal-btn modal-cancel" onclick="closeModalAndResetCount()">取消</button>
            <button class="modal-btn modal-confirm" id="modalConfirm" onclick="modalConfirmClick()">确认</button>
        </div>
    </div>
    <!-- 离线广告弹窗（无网络图片，纯手绘） -->
    <div id="adModal">
        <div id="adDraw"></div>
        <div id="adCountdown">10</div>
        <div id="adTip">观看广告10秒，免费获取免死金牌</div>
    </div>

    <script>
        // === 全局核心配置 ===
        const currentYear = new Date().getFullYear(); // 自动获取系统年份
        let resetRemindCount = 0; // 重置确认计数器（0-3）
        let modalType = ''; // 弹窗类型：remind1/remind2/remind3/verify
        // 广告相关全局变量
        let adTimer = null;
        // === 存档系统 - 核心数据结构 ===
        let gameData = {
            totalScore: 0,          // 玩家总得分（累积）
            immortalLevel: 1,       // 免死购买等级
            buyPrice: 10,           // 当前购买价格
            baseTime: 10,           // 当前获得时长
            obstacleFreq: 1000,     // 障碍物频率
            playerColor: '#3182ce', // 玩家颜色（默认）
            obsColor: '#e53e3e',    // 障碍物颜色（默认）
            playerImg: '',          // 玩家自定义图片Base64
            obsImg: ''              // 障碍物自定义图片Base64
        };
        // === DOM元素获取 ===
        // 基础面板
        const startScreen = document.getElementById('startScreen');
        const gameScreen = document.getElementById('gameScreen');
        const game = document.getElementById('game');
        const player = document.getElementById('player');
        const pauseMenu = document.getElementById('pauseMenu');
        const storePanel = document.getElementById('storePanel');
        const settingsPanel = document.getElementById('settingsPanel');
        const customPanel = document.getElementById('customPanel');
        // 分数与UI
        const totalScoreEl = document.getElementById('totalScore');
        const immortalLevelEl = document.getElementById('immortalLevel');
        const currentScoreEl = document.getElementById('currentScore');
        const storeScoreEl = document.getElementById('storeScore');
        const buyPriceEl = document.getElementById('buyPrice');
        const addTimeEl = document.getElementById('addTime');
        // 自定义弹窗
        const mask = document.getElementById('mask');
        const customModal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalContent = document.getElementById('modalContent');
        const modalInput = document.getElementById('modalInput');
        const modalConfirm = document.getElementById('modalConfirm');
        // 免死与游戏状态
        const timerEl = document.getElementById('timer');
        // 离线广告DOM元素
        const adModal = document.getElementById('adModal');
        const adDraw = document.getElementById('adDraw');
        const adCountdown = document.getElementById('adCountdown');
        // 游戏状态变量
        let currentScore = 0;
        let gameRunning = false;
        let isPaused = false;
        let gameOver = false;
        let isImmortal = false;
        let immortalTime = 0;
        let immortalTimer = null;
        let obstacles = [];
        let lastObstacleTime = 0;
        let obstacleSpeed = 3;

        // === 20个离线手绘广告配置（背景色+文字，无网络依赖） ===
        const adDrawList = [
            {bg: "#ff4d4f", text: "广告1\n精品小游戏推荐"},
            {bg: "#1890ff", text: "广告2\n海量福利免费领"},
            {bg: "#fa8c16", text: "广告3\n限时特惠开启"},
            {bg: "#52c41a", text: "广告4\n全新版本上线"},
            {bg: "#722ed1", text: "广告5\n签到领豪华礼包"},
            {bg: "#eb2f96", text: "广告6\n邀好友一起闯关"},
            {bg: "#13c2c2", text: "广告7\n每日打卡有奖"},
            {bg: "#f7ba1e", text: "广告8\n解锁专属皮肤"},
            {bg: "#f5222d", text: "广告9\n闯关赢海量积分"},
            {bg: "#4876ff", text: "广告10\n新手专属福利"},
            {bg: "#ff7a45", text: "广告11\n限时道具兑换"},
            {bg: "#36cfc9", text: "广告12\n组队开黑更有趣"},
            {bg: "#9254de", text: "广告13\n超值礼包限时购"},
            {bg: "#ff6b6b", text: "广告14\n等级飙升秘籍"},
            {bg: "#4ecdc4", text: "广告15\n解锁全新关卡"},
            {bg: "#ff8c00", text: "广告16\n累计登录有礼"},
            {bg: "#6a5acd", text: "广告17\n战力快速提升"},
            {bg: "#20b2aa", text: "广告18\n免费领游戏道具"},
            {bg: "#ff69b4", text: "广告19\n跨服竞技赛开启"},
            {bg: "#gold", text: "广告20\n绝版外观限时领"}
        ];

        // === 自定义弹窗核心方法 ===
        function openModal(type, title, content, needInput = false) {
            mask.style.display = 'block';
            customModal.style.display = 'block';
            modalType = type;
            modalTitle.innerText = title;
            modalContent.innerText = content;
            if (needInput) {
                modalInput.style.display = 'block';
                modalInput.value = '';
                modalInput.focus();
            } else {
                modalInput.style.display = 'none';
            }
        }
        function closeModalAndResetCount() {
            mask.style.display = 'none';
            customModal.style.display = 'none';
            resetRemindCount = 0;
            modalType = '';
        }
        function modalConfirmClick() {
            switch (modalType) {
                case 'remind1': handleRemind1Confirm(); break;
                case 'remind2': handleRemind2Confirm(); break;
                case 'remind3': handleRemind3Confirm(); break;
                case 'verify': handleVerifyConfirm(); break;
            }
        }

        // === 重置验证核心逻辑 - 三步确认+年份验证 ===
        function startResetVerify() {
            resetRemindCount = 1;
            openModal('remind1', '第一次确认', '确定要重置游戏数据吗？数据清除后将不可恢复，还需确认2次');
        }
        function handleRemind1Confirm() {
            resetRemindCount = 2;
            openModal('remind2', '第二次确认', '最后警告！重置将清除所有得分、等级、自定义造型和设置，还需确认1次');
        }
        function handleRemind2Confirm() {
            resetRemindCount = 3;
            openModal('remind3', '第三次确认', '即将进入验证环节！请确认是否继续，下一步需输入当前年份完成最终验证');
        }
        function handleRemind3Confirm() {
            openModal('verify', '年份验证', `请输入当前年份【${currentYear}】完成重置验证`, true);
        }
        function handleVerifyConfirm() {
            const inputYear = parseInt(modalInput.value);
            if (isNaN(inputYear) || inputYear !== currentYear) {
                modalContent.innerText = `年份输入错误！请输入正确年份：${currentYear}`;
                modalInput.value = '';
                modalInput.focus();
                return;
            }
            resetAllGameData();
            mask.style.display = 'none';
            customModal.style.display = 'none';
            resetRemindCount = 0;
            modalType = '';
        }

        // === 重置所有游戏数据 ===
        function resetAllGameData() {
            gameData = {
                totalScore: 0, immortalLevel: 1, buyPrice: 10, baseTime: 10,
                obstacleFreq: 1000, playerColor: '#3182ce', obsColor: '#e53e3e',
                playerImg: '', obsImg: ''
            };
            saveGameData();
            applyCustomStyles();
            document.getElementById('freqSelect').value = gameData.obstacleFreq;
            document.getElementById('playerColor').value = gameData.playerColor;
            document.getElementById('obsColor').value = gameData.obsColor;
            openModal('success', '重置成功', '所有游戏数据已恢复为初始状态！');
            setTimeout(closeModalAndResetCount, 3000);
        }

        // === 存档核心方法 ===
        function loadGameData() {
            const saved = localStorage.getItem('fingerDodgeData');
            if (saved) {
                gameData = JSON.parse(saved);
                totalScoreEl.innerText = gameData.totalScore;
                immortalLevelEl.innerText = gameData.immortalLevel;
                buyPriceEl.innerText = gameData.buyPrice;
                addTimeEl.innerText = gameData.baseTime;
                document.getElementById('freqSelect').value = gameData.obstacleFreq;
                document.getElementById('playerColor').value = gameData.playerColor;
                document.getElementById('obsColor').value = gameData.obsColor;
                applyCustomStyles();
            }
        }
        function saveGameData() {
            localStorage.setItem('fingerDodgeData', JSON.stringify(gameData));
            totalScoreEl.innerText = gameData.totalScore;
            immortalLevelEl.innerText = gameData.immortalLevel;
        }

        // === 自定义造型核心方法 ===
        function applyCustomStyles() {
            if (gameData.playerImg) {
                player.style.backgroundImage = `url(${gameData.playerImg})`;
                player.style.backgroundColor = 'transparent';
            } else {
                player.style.backgroundImage = 'none';
                player.style.backgroundColor = gameData.playerColor;
            }
            obstacles.forEach(obs => {
                if (gameData.obsImg) {
                    obs.el.style.backgroundImage = `url(${gameData.obsImg})`;
                    obs.el.style.backgroundColor = 'transparent';
                } else {
                    obs.el.style.backgroundImage = 'none';
                    obs.el.style.backgroundColor = gameData.obsColor;
                }
            });
        }
        function initImageSelectors() {
            // 玩家图片
            document.getElementById('playerImgSelector').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                readImageFile(file, (base64) => {
                    gameData.playerImg = base64;
                    saveGameData();
                    applyCustomStyles();
                    openModal('success', '设置成功', '玩家造型已更新！');
                    setTimeout(closeModalAndResetCount, 2000);
                });
            });
            // 障碍物图片
            document.getElementById('obsImgSelector').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                readImageFile(file, (base64) => {
                    gameData.obsImg = base64;
                    saveGameData();
                    applyCustomStyles();
                    openModal('success', '设置成功', '障碍物造型已更新！');
                    setTimeout(closeModalAndResetCount, 2000);
                });
            });
        }
        function readImageFile(file, callback) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = file === document.getElementById('playerImgSelector').files[0] ? 40 : 60;
                    canvas.height = file === document.getElementById('playerImgSelector').files[0] ? 40 : 20;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/png'));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
        function restoreDefaultStyles() {
            gameData.playerImg = '';
            gameData.obsImg = '';
            gameData.playerColor = '#3182ce';
            gameData.obsColor = '#e53e3e';
            document.getElementById('playerColor').value = '#3182ce';
            document.getElementById('obsColor').value = '#e53e3e';
            saveGameData();
            applyCustomStyles();
            openModal('success', '恢复成功', '已恢复默认造型！');
            setTimeout(closeModalAndResetCount, 2000);
        }

        // === 面板控制方法 ===
        function openStore() {
            if (gameOver) return;
            storeScoreEl.innerText = currentScore + gameData.totalScore;
            storePanel.style.display = 'flex';
        }
        function closeStore() { storePanel.style.display = 'none'; }
        function openSettings() {
            settingsPanel.style.display = 'flex';
            resetRemindCount = 0;
        }
        function closeSettings() {
            settingsPanel.style.display = 'none';
            resetRemindCount = 0;
        }
        function openCustomPanel() { customPanel.style.display = 'flex'; }
        function closeCustomPanel() { customPanel.style.display = 'none'; }

        // === 游戏核心逻辑 ===
        function startGame() {
            currentScore = 0;
            currentScoreEl.innerText = currentScore;
            gameOver = false;
            isPaused = false;
            isImmortal = false;
            immortalTime = 0;
            timerEl.style.display = 'none';
            obstacles.forEach(obs => obs.el.remove());
            obstacles = [];
            lastObstacleTime = 0;
            obstacleSpeed = 3;
            applyCustomStyles();
            startScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            if (!gameRunning) {
                gameRunning = true;
                requestAnimationFrame(gameLoop);
            }
        }
        function backToStart() {
            gameData.totalScore += currentScore;
            saveGameData();
            if (immortalTimer) clearInterval(immortalTimer);
            if (adTimer) clearInterval(adTimer);
            obstacles.forEach(obs => obs.el.remove());
            obstacles = [];
            gameRunning = false;
            isPaused = false;
            gameOver = false;
            isImmortal = false;
            immortalTime = 0;
            timerEl.style.display = 'none';
            adModal.style.display = 'none';
            resetRemindCount = 0;
            gameScreen.style.display = 'none';
            startScreen.style.display = 'flex';
            pauseMenu.style.display = 'none';
            storePanel.style.display = 'none';
            settingsPanel.style.display = 'none';
            customPanel.style.display = 'none';
            closeModalAndResetCount();
        }
        function togglePause() {
            isPaused = !isPaused;
            pauseMenu.style.display = isPaused ? 'flex' : 'none';
        }
        function buyImmortal() {
            const availableScore = currentScore + gameData.totalScore;
            if (availableScore < gameData.buyPrice) {
                openModal('error', '操作失败', '得分不足，无法购买免死金牌！');
                return;
            }
            if (currentScore >= gameData.buyPrice) {
                currentScore -= gameData.buyPrice;
            } else {
                const diff = gameData.buyPrice - currentScore;
                currentScore = 0;
                gameData.totalScore -= diff;
            }
            gameData.immortalLevel++;
            gameData.buyPrice += 5;
            gameData.baseTime += 5;
            saveGameData();
            currentScoreEl.innerText = currentScore;
            storeScoreEl.innerText = currentScore + gameData.totalScore;
            buyPriceEl.innerText = gameData.buyPrice;
            addTimeEl.innerText = gameData.baseTime;
            immortalLevelEl.innerText = gameData.immortalLevel;
            activateImmortal(gameData.baseTime);
            closeStore();
        }
        // 激活免死金牌（商店/广告通用）
        function activateImmortal(addSec) {
            isImmortal = true;
            immortalTime += addSec;
            timerEl.style.display = 'block';
            timerEl.innerText = immortalTime;
            if (immortalTimer) clearInterval(immortalTimer);
            immortalTimer = setInterval(() => {
                immortalTime--;
                timerEl.innerText = immortalTime;
                if (immortalTime <= 0) {
                    clearInterval(immortalTimer);
                    isImmortal = false;
                    timerEl.style.display = 'none';
                }
            }, 1000);
        }
        function saveSettings() {
            gameData.obstacleFreq = parseInt(document.getElementById('freqSelect').value);
            gameData.playerColor = document.getElementById('playerColor').value;
            gameData.obsColor = document.getElementById('obsColor').value;
            if (!gameData.playerImg) player.style.backgroundColor = gameData.playerColor;
            if (!gameData.obsImg) obstacles.forEach(obs => obs.el.style.backgroundColor = gameData.obsColor);
            saveGameData();
            openModal('success', '保存成功', '设置已永久生效！');
            setTimeout(() => {
                closeModalAndResetCount();
                closeSettings();
            }, 2000);
        }
        // 碰撞检测（免死生效判断）
        function checkCollision(el1, el2) {
            const r1 = el1.getBoundingClientRect();
            const r2 = el2.getBoundingClientRect();
            return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
        }
        function createObstacle() {
            const obs = document.createElement('div');
            obs.classList.add('obstacle');
            if (gameData.obsImg) {
                obs.style.backgroundImage = `url(${gameData.obsImg})`;
                obs.style.backgroundColor = 'transparent';
            } else {
                obs.style.backgroundImage = 'none';
                obs.style.backgroundColor = gameData.obsColor;
            }
            const x = Math.random() * (game.clientWidth - 60);
            obs.style.left = x + 'px';
            obs.style.top = '0px';
            game.appendChild(obs);
            obstacles.push({ el: obs, x: x, y: 0 });
        }
        function gameLoop(timestamp) {
            if (!gameRunning) return;
            if (gameOver || isPaused) {
                requestAnimationFrame(gameLoop);
                return;
            }
            if (timestamp - lastObstacleTime > gameData.obstacleFreq) {
                createObstacle();
                lastObstacleTime = timestamp;
                obstacleSpeed = 3 + (currentScore + gameData.totalScore) / 100;
            }
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += obstacleSpeed;
                obs.el.style.top = obs.y + 'px';
                // 免死金牌正常生效：有免死则碰撞不结束游戏
                if (!isImmortal && checkCollision(player, obs.el)) {
                    gameOver = true;
                    gameData.totalScore += currentScore;
                    saveGameData();
                    openModal('gameOver', '游戏结束', `本局得分：${currentScore}\n总得分：${gameData.totalScore}`);
                    setTimeout(backToStart, 3000);
                    break;
                }
                if (obs.y > game.clientHeight) {
                    obs.el.remove();
                    obstacles.splice(i, 1);
                    currentScore++;
                    currentScoreEl.innerText = currentScore;
                }
            }
            requestAnimationFrame(gameLoop);
        }

        // === 触屏控制 ===
        game.addEventListener('touchmove', (e) => {
            if (gameOver || isPaused) return;
            const touch = e.touches[0];
            const rect = game.getBoundingClientRect();
            let playerX = touch.clientX - rect.left - player.clientWidth / 2;
            playerX = Math.max(0, Math.min(playerX, game.clientWidth - player.clientWidth));
            player.style.left = playerX + 'px';
        });

        // === 离线广告获取免死金牌核心方法 ===
        function showAdGetGod() {
            if (gameOver || isPaused) {
                openModal('error', '操作失败', '游戏未开始或已暂停，无法获取免死金牌！');
                return;
            }
            // 暂停游戏
            isPaused = true;
            // 随机选择20个手绘广告中的一个
            const randomIndex = Math.floor(Math.random() * adDrawList.length);
            adDraw.style.background = adDrawList[randomIndex].bg;
            adDraw.innerText = adDrawList[randomIndex].text;
            // 重置10秒倒计时
            let adTime = 10;
            adCountdown.innerText = adTime;
            // 显示广告弹窗
            adModal.style.display = 'block';
            // 广告倒计时逻辑
            if (adTimer) clearInterval(adTimer);
            adTimer = setInterval(() => {
                adTime--;
                adCountdown.innerText = adTime;
                if (adTime <= 0) {
                    clearInterval(adTimer);
                    adModal.style.display = 'none';
                    // 激活免死金牌（时长随等级提升）
                    activateImmortal(gameData.baseTime);
                    // 恢复游戏
                    isPaused = false;
                    // 提示获取成功
                    openModal('success', '获取成功', `已获得${gameData.baseTime}秒免死金牌！`);
                    setTimeout(closeModalAndResetCount, 1500);
                }
            }, 1000);
        }

        // === 页面初始化 ===
        window.onload = function() {
            loadGameData();
            initImageSelectors();
        };
        // 点击遮罩层关闭弹窗
        mask.addEventListener('click', closeModalAndResetCount);
        // 阻止弹窗内部点击冒泡
        customModal.addEventListener('click', (e) => { e.stopPropagation(); });
        adModal.addEventListener('click', (e) => { e.stopPropagation(); });
    </script>
</body>
</html>
