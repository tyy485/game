<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>指尖躲避</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1e1e1e;
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: white;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: none;
        }

        #gameArea {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #2d3748;
            overflow: hidden;
        }

        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #3182ce;
            border-radius: 4px;
            bottom: 50px;
            z-index: 10;
        }

        .obstacle {
            position: absolute;
            width: 60px;
            height: 20px;
            background-color: #e53e3e;
            border-radius: 2px;
        }

        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
        }

        #godTime {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 18px;
            color: #ffd700;
            font-weight: bold;
            display: none;
            z-index: 100;
        }

        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .menu-title {
            font-size: 48px;
            margin-bottom: 40px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .menu-button {
            width: 200px;
            height: 60px;
            margin: 10px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .menu-button:hover {
            transform: scale(1.05);
        }

        #startBtn {
            background-color: #48bb78;
            color: white;
        }

        #shopBtn {
            background-color: #ed8936;
            color: white;
        }

        #settingsBtn {
            background-color: #718096;
            color: white;
        }

        #customizeBtn {
            background-color: #805ad5;
            color: white;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 2000;
        }

        #gameOver h2 {
            color: #e53e3e;
            margin-bottom: 20px;
        }

        #restartBtn, #backToMenuBtn {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #restartBtn {
            background-color: #48bb78;
            color: white;
        }

        #backToMenuBtn {
            background-color: #718096;
            color: white;
        }

        #pauseBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background-color: #718096;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 100;
        }

        #getGodBtn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #ffd700;
            color: black;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
        }

        #shop, #settings, #customize {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .panel-title {
            font-size: 36px;
            margin-bottom: 30px;
            color: #ffd700;
        }

        .info-text {
            font-size: 18px;
            margin: 10px;
        }

        .buy-button {
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            background-color: #48bb78;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .back-button {
            margin-top: 30px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #718096;
            color: white;
            cursor: pointer;
        }

        #adPopup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 3000;
        }

        #adContent {
            margin: 20px 0;
            width: 300px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        #adTimer {
            font-size: 24px;
            margin: 10px 0;
        }

        .setting-item {
            margin: 15px;
            text-align: center;
        }

        .setting-item label {
            display: block;
            margin-bottom: 5px;
            font-size: 18px;
        }

        .color-input {
            width: 100px;
            height: 50px;
            border: none;
            cursor: pointer;
        }

        .file-input {
            margin: 10px 0;
        }

        .reset-button {
            background-color: #e53e3e;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }

        #totalScoreDisplay {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 20px;
        }

        #godLevelDisplay {
            font-size: 20px;
            color: #38b2ac;
            margin-bottom: 30px;
        }

        #difficultySelect {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            background-color: #2d3748;
            color: white;
            border: 1px solid #718096;
        }

        #confirmReset {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 4000;
            border: 2px solid #e53e3e;
        }

        #yearInput {
            padding: 10px;
            font-size: 16px;
            margin: 15px 0;
            width: 150px;
            text-align: center;
        }

        .toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            display: none;
            z-index: 5000;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1 class="menu-title">指尖躲避</h1>
        <div id="totalScoreDisplay">总得分: 0</div>
        <div id="godLevelDisplay">免死等级: 0</div>
        <button class="menu-button" id="startBtn">开始游戏</button>
        <button class="menu-button" id="shopBtn">商店</button>
        <button class="menu-button" id="settingsBtn">设置</button>
        <button class="menu-button" id="customizeBtn">自定义</button>
    </div>

    <div id="gameContainer">
        <div id="gameArea">
            <div id="player"></div>
            <div id="scoreBoard">得分: 0</div>
            <div id="godTime">免死: 0s</div>
            <button id="pauseBtn">||</button>
            <button id="getGodBtn">获取免死</button>
        </div>
    </div>

    <div id="gameOver">
        <h2>游戏结束</h2>
        <p id="finalScore">最终得分: 0</p>
        <button id="restartBtn">重新开始</button>
        <button id="backToMenuBtn">返回菜单</button>
    </div>

    <div id="shop">
        <h2 class="panel-title">商店</h2>
        <div class="info-text">当前金币: <span id="shopScore">0</span></div>
        <div class="info-text">免死等级: <span id="shopGodLevel">0</span></div>
        <div class="info-text">下一级价格: <span id="godPrice">10</span> 金币</div>
        <div class="info-text">免死时长: <span id="godDuration">10</span> 秒</div>
        <button class="buy-button" id="buyGodBtn">升级免死金牌</button>
        <button class="back-button" id="backToMenuFromShop">返回</button>
    </div>

    <div id="settings">
        <h2 class="panel-title">设置</h2>
        <div class="setting-item">
            <label>障碍物频率</label>
            <select id="difficultySelect">
                <option value="2000">很慢</option>
                <option value="1500">慢</option>
                <option value="1000" selected>正常</option>
                <option value="700">快</option>
                <option value="500">很快</option>
                <option value="300">极快</option>
                <option value="150">疯狂</option>
            </select>
        </div>
        <button class="reset-button" id="resetDataBtn">重置所有数据</button>
        <button class="back-button" id="backToMenuFromSettings">返回</button>
    </div>

    <div id="customize">
        <h2 class="panel-title">自定义</h2>
        <div class="setting-item">
            <label>玩家颜色</label>
            <input type="color" id="playerColor" class="color-input" value="#3182ce">
        </div>
        <div class="setting-item">
            <label>障碍物颜色</label>
            <input type="color" id="obstacleColor" class="color-input" value="#e53e3e">
        </div>
        <div class="setting-item">
            <label>玩家图片</label>
            <input type="file" id="playerImage" class="file-input" accept="image/*">
        </div>
        <div class="setting-item">
            <label>障碍物图片</label>
            <input type="file" id="obstacleImage" class="file-input" accept="image/*">
        </div>
        <button class="buy-button" id="resetCustomBtn">恢复默认</button>
        <button class="back-button" id="backToMenuFromCustomize">返回</button>
    </div>

    <div id="adPopup">
        <h3>观看广告获得免死</h3>
        <div id="adContent"></div>
        <div id="adTimer">10</div>
        <p>请稍候...</p>
    </div>

    <div id="confirmReset">
        <h3>确定要重置所有数据吗？</h3>
        <p>此操作不可撤销！</p>
        <p>请输入当前年份确认：</p>
        <input type="number" id="yearInput" placeholder="输入年份">
        <button id="confirmResetBtn">确认重置</button>
        <button id="cancelResetBtn">取消</button>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let gameArea = document.getElementById('gameArea');
        let player = document.getElementById('player');
        let scoreBoard = document.getElementById('scoreBoard');
        let godTime = document.getElementById('godTime');
        let gameContainer = document.getElementById('gameContainer');
        let menu = document.getElementById('menu');
        let gameOver = document.getElementById('gameOver');
        let finalScore = document.getElementById('finalScore');
        let totalScoreDisplay = document.getElementById('totalScoreDisplay');
        let godLevelDisplay = document.getElementById('godLevelDisplay');

        let playerX = window.innerWidth / 2 - 20;
        let playerY = window.innerHeight - 100;
        let score = 0;
        let totalScore = 0;
        let gameRunning = false;
        let isPaused = false;
        let godMode = false;
        let godModeTime = 0;
        let godLevel = 0;
        let godPrice = 10;
        let godDuration = 10;
        let obstacleInterval = 1000;
        let obstacleSpeed = 3;

        let gameLoop;
        let obstacleSpawnInterval;
        let godInterval;
        let adInterval;

        let playerColor = '#3182ce';
        let obstacleColor = '#e53e3e';
        let playerImageSrc = '';
        let obstacleImageSrc = '';

        const ads = [
            {bg: '#ff6b6b', text: '超级饮料'},
            {bg: '#4ecdc4', text: '快速跑鞋'},
            {bg: '#45b7d1', text: '飞行背包'},
            {bg: '#96ceb4', text: '能量饼干'},
            {bg: '#feca57', text: '幸运糖果'},
            {bg: '#ff9ff3', text: '魔法药水'},
            {bg: '#54a0ff', text: '闪电鞋'},
            {bg: '#48dbfb', text: '火箭推进器'},
            {bg: '#ff9f43', text: '超级护盾'},
            {bg: '#1dd1a1', text: '生命苹果'},
            {bg: '#ff3f34', text: '速度药丸'},
            {bg: '#00d2d3', text: '隐形斗篷'},
            {bg: '#ff9ff3', text: '跳跃靴子'},
            {bg: '#5f27cd', text: '时间停止器'},
            {bg: '#00d2d3', text: '飞行胶囊'},
            {bg: '#ff6b6b', text: '力量手套'},
            {bg: '#48dbfb', text: '极速滑板'},
            {bg: '#1dd1a1', text: '保护光环'},
            {bg: '#ff9f43', text: '幸运四叶草'},
            {bg: '#54a0ff', text: '超级翅膀'}
        ];

        function init() {
            loadGameData();
            updateMenuDisplay();
            setupEventListeners();
            applyCustomization();
        }

        function setupEventListeners() {
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', restartGame);
            document.getElementById('backToMenuBtn').addEventListener('click', backToMenu);
            document.getElementById('pauseBtn').addEventListener('click', togglePause);
            document.getElementById('getGodBtn').addEventListener('click', showAd);
            
            document.getElementById('shopBtn').addEventListener('click', () => {
                menu.style.display = 'none';
                document.getElementById('shop').style.display = 'flex';
                updateShopDisplay();
            });
            
            document.getElementById('backToMenuFromShop').addEventListener('click', () => {
                document.getElementById('shop').style.display = 'none';
                menu.style.display = 'flex';
            });
            
            document.getElementById('buyGodBtn').addEventListener('click', buyGodMode);
            
            document.getElementById('settingsBtn').addEventListener('click', () => {
                menu.style.display = 'none';
                document.getElementById('settings').style.display = 'flex';
            });
            
            document.getElementById('backToMenuFromSettings').addEventListener('click', () => {
                document.getElementById('settings').style.display = 'none';
                menu.style.display = 'flex';
            });
            
            document.getElementById('difficultySelect').addEventListener('change', (e) => {
                obstacleInterval = parseInt(e.target.value);
                saveGameData();
            });
            
            document.getElementById('customizeBtn').addEventListener('click', () => {
                menu.style.display = 'none';
                document.getElementById('customize').style.display = 'flex';
                document.getElementById('playerColor').value = playerColor;
                document.getElementById('obstacleColor').value = obstacleColor;
            });
            
            document.getElementById('backToMenuFromCustomize').addEventListener('click', () => {
                document.getElementById('customize').style.display = 'none';
                menu.style.display = 'flex';
                applyCustomization();
                saveGameData();
            });
            
            document.getElementById('playerColor').addEventListener('change', (e) => {
                playerColor = e.target.value;
            });
            
            document.getElementById('obstacleColor').addEventListener('change', (e) => {
                obstacleColor = e.target.value;
            });
            
            document.getElementById('playerImage').addEventListener('change', (e) => {
                handleImageUpload(e, 'player');
            });
            
            document.getElementById('obstacleImage').addEventListener('change', (e) => {
                handleImageUpload(e, 'obstacle');
            });
            
            document.getElementById('resetCustomBtn').addEventListener('click', resetCustomization);
            
            document.getElementById('resetDataBtn').addEventListener('click', () => {
                document.getElementById('confirmReset').style.display = 'block';
            });
            
            document.getElementById('cancelResetBtn').addEventListener('click', () => {
                document.getElementById('confirmReset').style.display = 'none';
            });
            
            document.getElementById('confirmResetBtn').addEventListener('click', confirmResetData);

            gameArea.addEventListener('touchmove', movePlayer);
        }

        function movePlayer(e) {
            if (!gameRunning || isPaused) return;
            
            let touch = e.touches[0];
            let gameRect = gameArea.getBoundingClientRect();
            playerX = touch.clientX - gameRect.left - 20;
            
            if (playerX < 0) playerX = 0;
            if (playerX > gameArea.offsetWidth - 40) playerX = gameArea.offsetWidth - 40;
            
            player.style.left = playerX + 'px';
        }

        function startGame() {
            menu.style.display = 'none';
            gameContainer.style.display = 'block';
            gameOver.style.display = 'none';
            
            playerX = window.innerWidth / 2 - 20;
            player.style.left = playerX + 'px';
            
            score = 0;
            updateScore();
            
            gameRunning = true;
            isPaused = false;
            
            obstacleSpeed = 3;
            
            clearAllIntervals();
            startObstacleSpawn();
            gameLoop = requestAnimationFrame(updateGame);
        }

        function updateGame() {
            if (!gameRunning || isPaused) return;
            
            moveObstacles();
            checkCollisions();
            
            gameLoop = requestAnimationFrame(updateGame);
        }

        function startObstacleSpawn() {
            obstacleSpawnInterval = setInterval(() => {
                if (!isPaused) spawnObstacle();
            }, obstacleInterval);
        }

        function spawnObstacle() {
            let obstacle = document.createElement('div');
            obstacle.className = 'obstacle';
            
            if (obstacleImageSrc) {
                obstacle.style.backgroundImage = `url(${obstacleImageSrc})`;
                obstacle.style.backgroundSize = 'cover';
            } else {
                obstacle.style.backgroundColor = obstacleColor;
            }
            
            obstacle.style.left = Math.random() * (gameArea.offsetWidth - 60) + 'px';
            obstacle.style.top = '0px';
            gameArea.appendChild(obstacle);
        }

        function moveObstacles() {
            let obstacles = document.querySelectorAll('.obstacle');
            
            obstacles.forEach(obstacle => {
                let top = parseFloat(obstacle.style.top);
                obstacle.style.top = top + obstacleSpeed + 'px';
                
                if (top > gameArea.offsetHeight) {
                    obstacle.remove();
                    score++;
                    updateScore();
                    
                    if (score % 50 === 0) {
                        obstacleSpeed += 0.5;
                    }
                }
            });
        }

        function checkCollisions() {
            if (godMode) return;
            
            let playerRect = player.getBoundingClientRect();
            let obstacles = document.querySelectorAll('.obstacle');
            
            obstacles.forEach(obstacle => {
                let obstacleRect = obstacle.getBoundingClientRect();
                
                if (
                    playerRect.left < obstacleRect.right &&
                    playerRect.right > obstacleRect.left &&
                    playerRect.top < obstacleRect.bottom &&
                    playerRect.bottom > obstacleRect.top
                ) {
                    endGame();
                }
            });
        }

        function updateScore() {
            scoreBoard.textContent = '得分: ' + score;
        }

        function endGame() {
            gameRunning = false;
            cancelAnimationFrame(gameLoop);
            clearAllIntervals();
            
            totalScore += score;
            finalScore.textContent = '最终得分: ' + score;
            gameOver.style.display = 'block';
            
            updateMenuDisplay();
            saveGameData();
        }

        function restartGame() {
            clearObstacles();
            startGame();
        }

        function backToMenu() {
            gameRunning = false;
            cancelAnimationFrame(gameLoop);
            clearAllIntervals();
            clearObstacles();
            
            gameContainer.style.display = 'none';
            menu.style.display = 'flex';
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pauseBtn').textContent = isPaused ? '>' : '||';
            
            if (!isPaused) {
                gameLoop = requestAnimationFrame(updateGame);
            } else {
                cancelAnimationFrame(gameLoop);
            }
        }

        function showAd() {
            if (godMode) {
                showToast('已经在免死状态中！');
                return;
            }
            
            let ad = ads[Math.floor(Math.random() * ads.length)];
            let adContent = document.getElementById('adContent');
            adContent.style.backgroundColor = ad.bg;
            adContent.textContent = ad.text;
            
            document.getElementById('adPopup').style.display = 'block';
            
            let adTimer = 10;
            document.getElementById('adTimer').textContent = adTimer;
            
            adInterval = setInterval(() => {
                adTimer--;
                document.getElementById('adTimer').textContent = adTimer;
                
                if (adTimer <= 0) {
                    clearInterval(adInterval);
                    document.getElementById('adPopup').style.display = 'none';
                    startGodMode(godDuration);
                }
            }, 1000);
        }

        // 修复后的免死金牌：暂停时不计时
        function startGodMode(seconds) {
            godMode = true;
            godModeTime = seconds;
            updateGodTimeDisplay();
            godTime.style.display = 'block';
            
            if (godInterval) clearInterval(godInterval);
            
            godInterval = setInterval(() => {
                // 只有游戏不暂停时才计时
                if (!isPaused && godModeTime > 0) {
                    godModeTime--;
                    updateGodTimeDisplay();
                }
                
                if (godModeTime <= 0) {
                    clearInterval(godInterval);
                    godMode = false;
                    godTime.style.display = 'none';
                }
            }, 1000);
        }

        function updateGodTimeDisplay() {
            godTime.textContent = '免死: ' + godModeTime + 's';
        }

        function buyGodMode() {
            if (totalScore >= godPrice) {
                totalScore -= godPrice;
                godLevel++;
                godPrice += 5;
                godDuration += 5;
                
                updateShopDisplay();
                updateMenuDisplay();
                saveGameData();
                showToast('升级成功！');
            } else {
                showToast('金币不足！');
            }
        }

        function updateShopDisplay() {
            document.getElementById('shopScore').textContent = totalScore;
            document.getElementById('shopGodLevel').textContent = godLevel;
            document.getElementById('godPrice').textContent = godPrice;
            document.getElementById('godDuration').textContent = godDuration;
        }

        function updateMenuDisplay() {
            totalScoreDisplay.textContent = '总得分: ' + totalScore;
            godLevelDisplay.textContent = '免死等级: ' + godLevel;
        }

        function clearObstacles() {
            let obstacles = document.querySelectorAll('.obstacle');
            obstacles.forEach(obstacle => obstacle.remove());
        }

        function clearAllIntervals() {
            clearInterval(obstacleSpawnInterval);
            clearInterval(godInterval);
            clearInterval(adInterval);
        }

        function saveGameData() {
            let gameData = {
                totalScore: totalScore,
                godLevel: godLevel,
                godPrice: godPrice,
                godDuration: godDuration,
                obstacleInterval: obstacleInterval,
                playerColor: playerColor,
                obstacleColor: obstacleColor,
                playerImageSrc: playerImageSrc,
                obstacleImageSrc: obstacleImageSrc
            };
            localStorage.setItem('fingerAvoidGameData', JSON.stringify(gameData));
        }

        function loadGameData() {
            let savedData = localStorage.getItem('fingerAvoidGameData');
            if (savedData) {
                let gameData = JSON.parse(savedData);
                totalScore = gameData.totalScore || 0;
                godLevel = gameData.godLevel || 0;
                godPrice = gameData.godPrice || 10;
                godDuration = gameData.godDuration || 10;
                obstacleInterval = gameData.obstacleInterval || 1000;
                playerColor = gameData.playerColor || '#3182ce';
                obstacleColor = gameData.obstacleColor || '#e53e3e';
                playerImageSrc = gameData.playerImageSrc || '';
                obstacleImageSrc = gameData.obstacleImageSrc || '';
                
                document.getElementById('difficultySelect').value = obstacleInterval;
            }
        }

        function handleImageUpload(event, type) {
            let file = event.target.files[0];
            if (!file) return;
            
            let reader = new FileReader();
            reader.onload = function(e) {
                if (type === 'player') {
                    playerImageSrc = e.target.result;
                } else {
                    obstacleImageSrc = e.target.result;
                }
            };
            reader.readAsDataURL(file);
        }

        function applyCustomization() {
            if (playerImageSrc) {
                player.style.backgroundImage = `url(${playerImageSrc})`;
                player.style.backgroundSize = 'cover';
                player.style.backgroundColor = 'transparent';
            } else {
                player.style.backgroundColor = playerColor;
                player.style.backgroundImage = '';
            }
        }

        function resetCustomization() {
            playerColor = '#3182ce';
            obstacleColor = '#e53e3e';
            playerImageSrc = '';
            obstacleImageSrc = '';
            
            document.getElementById('playerColor').value = playerColor;
            document.getElementById('obstacleColor').value = obstacleColor;
            document.getElementById('playerImage').value = '';
            document.getElementById('obstacleImage').value = '';
            
            applyCustomization();
            showToast('已恢复默认设置');
        }

        function confirmResetData() {
            let yearInput = document.getElementById('yearInput').value;
            let currentYear = new Date().getFullYear();
            
            if (parseInt(yearInput) === currentYear) {
                localStorage.removeItem('fingerAvoidGameData');
                location.reload();
            } else {
                showToast('年份错误！');
            }
        }

        function showToast(message) {
            let toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
